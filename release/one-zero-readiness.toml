schema_version = 9
# External conformance entries must retain their exact tested subjects; a
# report-only entry is intentionally not representable. Platform releases also
# require separate archive/install-report attestations and the extracted
# release report plus SHA256SUMS chain. Schema v4 separately audits external
# accelerator adapters without letting them satisfy the 1.0 external-system gate.
# Schema v5 adds content-addressed simulator adapters without relabelling them
# as hardware adapters.
# Schema v6 requires third-party plugin entries to retain the release archive,
# acyclic candidate, committed logs, and maintainer verification report.
# Schema v7 requires the equivalent complete chain for simulator adapters.
# Schema v8 applies the same complete chain to external-project TaskSpecs and
# every member of their verified Failure Capsules.
# Schema v9 makes one independently reproduced installed flagship run an
# explicit gate and binds its archive, proof bundle, candidate, logs, and
# maintainer verification report.
