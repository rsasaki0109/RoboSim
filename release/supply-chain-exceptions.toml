[[advisory]]
id = "RUSTSEC-2024-0436"
package = "paste"
version = "1.0.15"
category = "unmaintained"
reachability = "rne_physics_rapier -> rapier3d 0.22.0 -> parry3d 0.17.6 -> nalgebra 0.33.3 -> simba 0.9.1 -> paste 1.0.15"
owner = "RNE release engineering"
rationale = "Rapier 0.22's compatible nalgebra/simba graph still requires paste; no maintained drop-in version is available."
mitigation = "paste executes only as a checksummed build-time proc macro and processes trusted RNE source tokens, not runtime or network input."
expires = "2027-02-12"

