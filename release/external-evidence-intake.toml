schema_version = 5
guide_path = "docs/EXTERNAL_EVIDENCE_INTAKE.md"
installed_flagship_quickstart_path = "docs/EXTERNAL_FLAGSHIP_REPRODUCTION.md"
installed_flagship_submission_template_path = "release/external-flagship-submission-template.json"

[[route]]
id = "installed_flagship_reproduction"
readiness_check = "installed_flagship_reproduction"
minimum_accepted = 1
issue_template = ".github/ISSUE_TEMPLATE/installed-flagship-reproduction.yml"
independent_owner_required = true
author_assistance_allowed = false
qualifying_kinds = []
audited_nonqualifying_kinds = []
required_metadata = ["owner", "repository", "revision", "measured_on", "author_assistance"]
required_artifacts = ["release_archive", "release_bundle", "installed_proof", "time_to_proof", "cross_backend_report", "failure_capsule"]
form_fields = ["independence", "repository", "revision", "rne_release", "platform", "machine", "measured_on", "release_archive", "proof_bundle", "reproduction_command", "verification"]

[[route]]
id = "external_project"
readiness_check = "external_projects"
minimum_accepted = 2
issue_template = ".github/ISSUE_TEMPLATE/external-project-evidence.yml"
independent_owner_required = true
author_assistance_allowed = false
qualifying_kinds = []
audited_nonqualifying_kinds = []
required_metadata = ["owner", "repository", "revision", "first_used_on", "last_verified_on", "author_assistance"]
required_artifacts = ["task_spec", "failure_capsule"]
form_fields = ["independence", "repository", "revision", "rne_release", "first_used_on", "last_verified_on", "task_spec", "failure_capsule", "reproduction_command", "verification"]

[[route]]
id = "third_party_plugin"
readiness_check = "third_party_plugin"
minimum_accepted = 1
issue_template = ".github/ISSUE_TEMPLATE/third-party-plugin-evidence.yml"
independent_owner_required = true
author_assistance_allowed = true
qualifying_kinds = []
audited_nonqualifying_kinds = []
