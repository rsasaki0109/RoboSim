schema_version = 1
guide_path = "docs/EXTERNAL_EVIDENCE_INTAKE.md"

[[route]]
id = "external_project"
readiness_check = "external_projects"
minimum_accepted = 2
issue_template = ".github/ISSUE_TEMPLATE/external-project-evidence.yml"
independent_owner_required = true
author_assistance_allowed = false
required_metadata = ["owner", "repository", "revision", "first_used_on", "last_verified_on", "author_assistance"]
required_artifacts = ["task_spec", "failure_capsule"]
form_fields = ["independence", "repository", "revision", "rne_release", "first_used_on", "last_verified_on", "task_spec", "failure_capsule", "reproduction_command", "verification"]

[[route]]
id = "third_party_plugin"
readiness_check = "third_party_plugin"
minimum_accepted = 1
issue_template = ".github/ISSUE_TEMPLATE/third-party-plugin-evidence.yml"
independent_owner_required = true
author_assistance_allowed = true
required_metadata = ["owner", "repository", "revision"]
required_artifacts = ["library", "manifest", "report"]
form_fields = ["independence", "repository", "revision", "rne_release", "platform", "library", "manifest", "report", "conformance_command", "verification"]

[[route]]
id = "external_system"
readiness_check = "external_system"
minimum_accepted = 1
issue_template = ".github/ISSUE_TEMPLATE/external-system-evidence.yml"
independent_owner_required = true
author_assistance_allowed = true
required_metadata = ["owner", "repository", "revision", "kind"]
required_artifacts = ["subject", "report"]
conditional_requirements = ["hardware_adapter.task_spec", "hardware_adapter.adapter_arguments", "hardware_adapter.safety_authorization"]
form_fields = ["independence", "kind", "repository", "revision", "rne_release", "platform", "subject", "task_spec", "adapter_arguments", "report", "conformance_command", "safety", "verification"]
