[package]
name = "rne_asset_cli"
description = "CLI for validating, running, and hot-reloading RNE asset files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
rne_assets = { path = "../../crates/rne_assets" }
rne_core = { path = "../../crates/rne_core" }
rne_data = { path = "../../crates/rne_data" }
rne_ecs = { path = "../../crates/rne_ecs" }
rne_log = { path = "../../crates/rne_log" }
rne_math = { path = "../../crates/rne_math" }
rne_physics = { path = "../../crates/rne_physics" }
rne_physics_analytic = { path = "../../crates/rne_physics_analytic" }
rne_physics_rapier = { path = "../../crates/rne_physics_rapier" }
rne_openscenario = { path = "../../crates/rne_openscenario" }
rne_plugin = { path = "../../crates/rne_plugin" }
rne_robot = { path = "../../crates/rne_robot" }
rne_sensor = { path = "../../crates/rne_sensor" }
rne_traffic = { path = "../../crates/rne_traffic" }
serde = { workspace = true }
serde_json = "1"
rne_world = { path = "../../crates/rne_world" }

[dev-dependencies]
rne_log = { path = "../../crates/rne_log" }

[[bin]]
name = "rne-asset"
path = "src/main.rs"
