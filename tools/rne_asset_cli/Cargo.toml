[package]
name = "rne_asset_cli"
description = "CLI for validating, running, and hot-reloading RNE asset files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { version = "4", features = ["derive"] }
rne_assets = { workspace = true }
rne_ai = { workspace = true }
rne_core = { workspace = true }
rne_data = { workspace = true }
rne_ecs = { workspace = true }
rne_hardware_gateway = { workspace = true }
rne_hardware_lekiwi = { workspace = true }
rne_log = { workspace = true }
rne_math = { workspace = true }
rne_physics = { workspace = true }
rne_physics_conformance = { workspace = true }
rne_physics_analytic = { workspace = true }
rne_physics_rapier = { workspace = true }
rne_openscenario = { workspace = true }
rne_plugin = { workspace = true }
rne_robot = { workspace = true }
rne_sensor = { workspace = true }
rne_sumo = { workspace = true }
rne_traci = { workspace = true }
rne_traffic = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
rne_world = { workspace = true }
[dev-dependencies]
rne_log = { workspace = true }
tempfile = "3"
[[bin]]
name = "rne-asset"
path = "src/main.rs"
