[package]
name = "rne_asset_cli"
description = "CLI for validating and hot-reloading RNE asset files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
rne_assets = { path = "../../crates/rne_assets" }
rne_core = { path = "../../crates/rne_core" }
rne_ecs = { path = "../../crates/rne_ecs" }
rne_math = { path = "../../crates/rne_math" }
rne_physics = { path = "../../crates/rne_physics" }
rne_physics_rapier = { path = "../../crates/rne_physics_rapier" }
rne_robot = { path = "../../crates/rne_robot" }
rne_world = { path = "../../crates/rne_world" }

[[bin]]
name = "rne-asset"
path = "src/main.rs"
