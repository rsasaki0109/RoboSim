# Front-page README media catalog.  The limits and references below are the
# machine-readable contract consumed by `xtask showcase-media-check`.
#
# The measured byte sizes and poster dimensions for this snapshot are recorded
# in docs/README_SHOWCASE.md so this minimal manifest remains compatible with
# the xtask manifest schema.
schema_version = 1
min_gif_bytes = 100_000
max_gif_bytes = 5_000_000
min_poster_width = 960
min_poster_height = 540
max_total_gif_bytes = 20_000_000

[[media]]
id = "mobile-manipulation"
label = "Mobile manipulation"
gif = "docs/media/rne-hero.gif"
poster = "docs/media/rne-hero.png"
