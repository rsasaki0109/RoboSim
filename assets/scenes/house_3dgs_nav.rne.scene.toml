[world]
gravity_m_s2 = [0.0, -9.81, 0.0]
seed = 2026

[ground]
enabled = true

[[robots]]
path = "../robots/dataset_diff_drive.rne.robot.toml"

# Invisible collision walls matching the house 3DGS shell (x,z in [-3.2, 3.2]).
