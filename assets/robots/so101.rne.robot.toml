kind = "urdf"
model_name = "so101"

[urdf]
path = "so101/so101.urdf"
base_body_type = "fixed"
initial_translation_m = [0.0, 0.0, 0.0]
articulation = true
# SO101 joints carry non-identity origin `rpy`. Without this the wired joint
# frames disagree with the authored pose and the solver resolves that as a
# violation on step one: the chain is launched 11.7 km. With it, the worst
# first-step link displacement is 0.0089 m.
use_joint_origin_rpy = true
