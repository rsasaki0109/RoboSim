schema_version = 1
robot_model = "mm_mobile_lift"
visual_only = true
coordinate_system = "rne_y_up_x_forward"
physics_asset = "mm_mobile_lift.urdf"
provenance = "PROVENANCE.md"

[budget]
# Budgets are evaluated over the complete ten-link pack.  Each individual
# link stays well below the 120k/40k LOD targets documented in provenance.
max_lod0_triangles = 120000
max_lod1_triangles = 40000
max_texture_size_px = 2048
max_texture_bytes = 16777216
max_materials = 80

