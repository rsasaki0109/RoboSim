[package]
name = "showcase_captures"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
mujoco = ["dep:rne_physics_mujoco", "rne_physics_mujoco/mujoco"]

[dependencies]
anyhow = { workspace = true }
png = { workspace = true }
rne_ai = { workspace = true }
rne_assets = { workspace = true }
rne_core = { workspace = true }
rne_data = { workspace = true }
rne_ecs = { workspace = true }
rne_math = { workspace = true }
rne_plateau = { workspace = true }
rne_physics = { workspace = true }
rne_physics_mujoco = { workspace = true, optional = true }
rne_render = { workspace = true }
rne_render_wgpu = { workspace = true }
rne_sensor = { workspace = true }
rne_world = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[[example]]
name = "90_showcase_captures"
path = "main.rs"

[[bin]]
name = "rne-openarm-rapier-trace"
path = "openarm_trace.rs"

[[bin]]
name = "rne-openarm-mujoco-trace"
path = "openarm_mujoco_trace.rs"
required-features = ["mujoco"]
