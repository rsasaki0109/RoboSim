[package]
name = "g1_backflip_gif"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rne_core = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
image = "0.25"
png = { workspace = true }
rne_ai = { workspace = true }
rne_dynamics = { workspace = true }
rne_math = { workspace = true }
rne_physics = { workspace = true }
# Activate the repository-only generalized-inertia extension.
rne_physics_rapier = { workspace = true, features = ["experimental-armature"] }
rne_render = { workspace = true }
rne_render_wgpu = { workspace = true, features = ["viewer"] }
rne_robot = { workspace = true }
rne_world = { workspace = true }

[[example]]
name = "114_g1_backflip_gif"
path = "main.rs"

[package.metadata.cargo-machete]
# rne_physics_rapier is only referenced through its "experimental-armature"
# feature flag (activated here, consumed by native.rs's RevoluteJointArmature
# usage); cargo-machete cannot see feature-only dependencies.
ignored = ["rne_physics_rapier"]
