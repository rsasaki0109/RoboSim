[package]
name = "rne_physics_conformance"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
mujoco = ["dep:rne_physics_mujoco", "rne_physics_mujoco/mujoco"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rne-physics-conformance"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
rne_core = { workspace = true }
rne_ecs = { workspace = true }
rne_math = { workspace = true }
rne_physics = { workspace = true }
rne_physics_analytic = { workspace = true }
rne_physics_mujoco = { path = "../../crates/rne_physics_mujoco", optional = true }
rne_physics_rapier = { workspace = true }
rne_world = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
