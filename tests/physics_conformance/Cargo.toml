[package]
name = "rne_physics_conformance_suite"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
mujoco = ["dep:rne_ai", "dep:rne_physics_mujoco", "rne_physics_mujoco/mujoco"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rne-physics-conformance"
path = "src/main.rs"
doc = false

[[bin]]
name = "rne-physics-divergence"
path = "src/divergence.rs"
required-features = ["mujoco"]
doc = false

[dependencies]
anyhow = { workspace = true }
rne_ai = { workspace = true, optional = true }
rne_core = { workspace = true }
rne_ecs = { workspace = true }
rne_math = { workspace = true }
rne_physics = { workspace = true }
rne_physics_analytic = { workspace = true }
rne_physics_mujoco = { version = "=0.1.0", path = "../../crates/rne_physics_mujoco", optional = true }
rne_physics_rapier = { workspace = true }
rne_world = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
