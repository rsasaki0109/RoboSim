[package]
name = "rne_compatibility_suite"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rne-compatibility"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = { workspace = true }
rne_ai = { workspace = true }
rne_core = { workspace = true }
rne_data = { workspace = true }
rne_hardware_gateway = { workspace = true }
rne_log = { workspace = true }
rne_math = { workspace = true }
rne_openscenario = { workspace = true }
rne_physics_conformance = { workspace = true }
rne_physics_conformance_suite = { version = "=0.1.0", path = "../physics_conformance" }
rne_plugin_sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
