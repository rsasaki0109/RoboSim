name: Installed flagship reproduction
description: Submit an independent, archive-bound 15-minute flagship reproduction for review.
title: "[Installed flagship reproduction] "
body:
  - type: markdown
    attributes:
      value: |
        Run the exact released archive workflow in docs/EXTERNAL_EVIDENCE_INTAKE.md without maintainer assistance.
        A submitted issue is not acceptance evidence. Maintainers re-download and verify every byte with external-flagship-check.
  - type: checkboxes
    id: independence
    attributes:
      label: Independence
      options:
        - label: The evidence repository is owned outside the RNE repository owner.
          required: true
        - label: The reproduction was completed without direct assistance from an RNE repository author.
          required: true
        - label: This was a named physical or virtual machine, not RNE CI or a placeholder measurement.
          required: true
        - label: The artifacts contain no credentials, personal data, or unredistributable files.
          required: true
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Evidence repository
      description: HTTPS URL of the independently owned public GitHub repository containing the reproduction log.
      placeholder: https://github.com/owner/rne-reproduction
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Evidence revision
      description: Exact lowercase 40-character Git commit ID.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: input
    id: rne_release
    attributes:
      label: RNE release
      description: Exact clean tagged RNE release and archive checksum used.
      placeholder: v0.x.y, sha256:...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Release target, operating system, and x86_64 architecture.
      placeholder: x86_64-pc-windows-msvc, Windows 11 x86_64
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Named measurement machine
      description: Stable, non-sensitive hardware or VM label passed to --measure-on.
      placeholder: community-lab-desktop-a
    validations:
      required: true
  - type: input
    id: measured_on
    attributes:
      label: Measurement date
      description: YYYY-MM-DD date of the independent reproduction.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: release_archive
    attributes:
      label: Release archive
      description: Immutable official archive URL, file name, byte size, and lowercase SHA-256.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: proof_bundle
    attributes:
      label: Proof bundle
      description: Immutable archive containing the unmodified installed proof directory and generated external reproduction report.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
        external_report_path:
    validations:
      required: true
  - type: textarea
    id: reproduction_command
    attributes:
      label: Clean reproduction commands
      description: Exact extraction, proof, and external-flagship-check commands with exit codes and elapsed output.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Submission verification
      options:
        - label: The installed command completed within 15 minutes and returned success.
          required: true
        - label: Rapier and bundled MuJoCo passed success and intentional-failure comparisons.
          required: true
        - label: external-flagship-check emitted a passed report for the exact archive, executable, proof, and Failure Capsule.
          required: true
        - label: Exact downloadable bytes will remain available for maintainer review.
          required: true
    validations:
      required: true
