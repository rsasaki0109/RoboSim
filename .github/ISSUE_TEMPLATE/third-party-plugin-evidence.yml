name: Third-party controller plugin evidence
description: Submit an independently owned controller plugin and passing conformance report.
title: "[Third-party plugin evidence] "
body:
  - type: markdown
    attributes:
      value: |
        Follow docs/PLUGIN_SDK.md and docs/EXTERNAL_EVIDENCE_INTAKE.md.
        A submitted issue is not acceptance evidence. The readiness gate rebinds the report to the exact library and manifest bytes.
  - type: checkboxes
    id: independence
    attributes:
      label: Independence
      options:
        - label: The plugin repository and implementation are owned outside the RNE repository owner.
          required: true
        - label: This is a real third-party implementation, not a copy of an in-repository reference plugin.
          required: true
        - label: The artifacts contain no credentials, personal data, or unredistributable files.
          required: true
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Plugin repository
      placeholder: https://github.com/owner/controller-plugin
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Tested revision
      description: Exact lowercase 40-character Git commit ID.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: input
    id: rne_release
    attributes:
      label: RNE release
      description: Exact installed RNE release tag and archive checksum.
      placeholder: v0.x.y, sha256:...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Conformance platform
      options:
        - Linux x86-64
        - Windows x86-64
    validations:
      required: true
  - type: textarea
    id: release_archive
    attributes:
      label: RNE release archive
      description: Immutable URL, exact file name, size, and lowercase sha256 for the archive used to run conformance.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: library
    attributes:
      label: Controller library
      description: Immutable URL, exact file name, size, and lowercase sha256 digest.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Plugin manifest
      description: Immutable URL, exact file name, size, and lowercase sha256 digest.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Conformance report
      description: Immutable URL and lowercase sha256 digest for the complete JSON report.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: submission_candidate
    attributes:
      label: Submission candidate
      description: Immutable URL, exact file name, size, and lowercase sha256 for the completed schema-v1 candidate committed at the tested revision. Keep the Git revision outside the JSON.
      placeholder: |
        URL:
        file:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: stdout_log
    attributes:
      label: Conformance stdout log
      description: Repository-relative committed path plus immutable URL, size, and lowercase sha256.
      placeholder: |
        path: logs/plugin-check.stdout.txt
        URL:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: stderr_log
    attributes:
      label: Conformance stderr log
      description: Repository-relative committed path plus immutable URL, size, and lowercase sha256.
      placeholder: |
        path: logs/plugin-check.stderr.txt
        URL:
        size_bytes:
        sha256:
    validations:
      required: true
  - type: textarea
    id: conformance_command
    attributes:
      label: Exact conformance command
      description: Include the released rne-asset plugin check invocation and exit status.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Submission verification
      options:
        - label: A fresh installed RNE bundle produced a passing typed conformance report.
          required: true
        - label: Two identical seeded resets produced identical typed frames.
          required: true
        - label: Exact downloadable library, manifest, and report bytes will remain available.
          required: true
        - label: The candidate and both logs are committed unchanged at the submitted revision.
          required: true
    validations:
      required: true
