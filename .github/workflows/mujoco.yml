name: MuJoCo physics backend

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/rne_physics/**"
      - "crates/rne_physics_mujoco/**"
      - "docs/PLAN_MUJOCO_SPIKE.md"
      - "tests/physics_conformance/**"
      - ".github/workflows/mujoco.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/rne_physics/**"
      - "crates/rne_physics_mujoco/**"
      - "docs/PLAN_MUJOCO_SPIKE.md"
      - "tests/physics_conformance/**"
      - ".github/workflows/mujoco.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mujoco:
    name: MuJoCo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: mujoco-3.9.0-linux-x86_64.tar.gz
            sha256: d11f281540d0d1844e2923bf43b6fff5ad186ec55927a8dae0eb26b9e579eed2
          - os: windows-latest
            archive: mujoco-3.9.0-windows-x86_64.zip
            sha256: 544f44a8a7df3e94648a7eaf41500f4456eb59f9f01df3ec2cfb03bdbf5c2bb9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mujoco-${{ matrix.os }}
          cache-all-crates: true

      - name: Download and verify MuJoCo (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          MUJOCO_ARCHIVE: ${{ matrix.archive }}
          MUJOCO_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$MUJOCO_ARCHIVE"
          install_root="$RUNNER_TEMP/mujoco"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/google-deepmind/mujoco/releases/download/3.9.0/$MUJOCO_ARCHIVE"
          printf '%s  %s\n' "$MUJOCO_SHA256" "$archive" | sha256sum --check --status
          rm -rf "$install_root"
          mkdir -p "$install_root"
          tar --extract --gzip --file "$archive" --directory "$install_root"
          root="$install_root/mujoco-3.9.0"
          test -f "$root/lib/libmujoco.so"
          printf 'MUJOCO_DYNAMIC_LINK_DIR=%s\n' "$root/lib" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s%s\n' "$root/lib" "${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Download and verify MuJoCo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MUJOCO_ARCHIVE: ${{ matrix.archive }}
          MUJOCO_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP $env:MUJOCO_ARCHIVE
          $installRoot = Join-Path $env:RUNNER_TEMP "mujoco"
          $url = "https://github.com/google-deepmind/mujoco/releases/download/3.9.0/$($env:MUJOCO_ARCHIVE)"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:MUJOCO_SHA256) {
            throw "MuJoCo SHA256 mismatch: expected $($env:MUJOCO_SHA256), got $actual"
          }
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot -Force
          # The official Windows zip expands directly to bin/ and lib/.
          $root = $installRoot
          $linkDir = Join-Path $root "lib"
          $loaderDir = Join-Path $root "bin"
          if (-not (Test-Path -LiteralPath (Join-Path $linkDir "mujoco.lib"))) {
            throw "MuJoCo import library was not found at $linkDir"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $loaderDir "mujoco.dll"))) {
            throw "MuJoCo DLL was not found at $loaderDir"
          }
          "MUJOCO_DYNAMIC_LINK_DIR=$linkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $loaderDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --locked -p rne_physics_mujoco --features mujoco --all-targets -- -D warnings
          cargo clippy --locked -p rne_physics_conformance --features mujoco --all-targets -- -D warnings

      - name: MuJoCo feature tests
        run: |
          cargo test --locked -p rne_physics_mujoco --features mujoco
          cargo test --locked -p rne_physics_conformance --features mujoco
