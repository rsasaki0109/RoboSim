[package]
name = "rne_physics"
description = "Physics backend traits and components for Robot Native Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# RNE 0.x permits documented capability/error enum growth. Keep additions
# visible in semver CI while rejecting removals, field changes, and reordering.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = "warn"

[dependencies]
bevy_ecs = { workspace = true }
rne_core = { workspace = true }
rne_ecs = { workspace = true }
rne_math = { workspace = true }
rne_world = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = "0.5"
serde_json = { workspace = true }
