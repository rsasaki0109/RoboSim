exclude = [
  "adapters/ros2/rne_ros2_node",
  # Standalone wasm crate with its own [workspace]: joining the root workspace
  # would unify native-only features into the wasm32 build.
  "web/rne_web_viewer",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsasaki0109/RoboSim"
rust-version = "1.88.0"
version = "0.1.0"

[workspace.dependencies]
# Internal crates use exact release requirements so packaged manifests resolve the
# same release set from a registry after Cargo removes local paths.
rne_adapter_ros2 = { version = "=0.1.0", path = "adapters/ros2/rne_adapter_ros2" }
rne_ai = { version = "=0.1.0", path = "crates/rne_ai" }
rne_assets = { version = "=0.1.0", path = "crates/rne_assets" }
rne_core = { version = "=0.1.0", path = "crates/rne_core" }
rne_data = { version = "=0.1.0", path = "crates/rne_data" }
rne_deformable = { version = "=0.1.0", path = "crates/rne_deformable" }
rne_ecs = { version = "=0.1.0", path = "crates/rne_ecs" }
rne_fuzz_smoke = { version = "=0.1.0", path = "tests/fuzz_smoke" }
rne_log = { version = "=0.1.0", path = "crates/rne_log" }
rne_math = { version = "=0.1.0", path = "crates/rne_math" }
rne_mjcf = { version = "=0.1.0", path = "crates/rne_mjcf" }
rne_openscenario = { version = "=0.1.0", path = "crates/rne_openscenario" }
rne_physics = { version = "=0.1.0", path = "crates/rne_physics" }
rne_physics_analytic = { version = "=0.1.0", path = "crates/rne_physics_analytic" }
rne_physics_rapier = { version = "=0.1.0", path = "crates/rne_physics_rapier" }
rne_plateau = { version = "=0.1.0", path = "crates/rne_plateau" }
rne_plugin = { version = "=0.1.0", path = "crates/rne_plugin" }
rne_py = { version = "=0.1.0", path = "crates/rne_py" }
rne_render = { version = "=0.1.0", path = "crates/rne_render" }
rne_render_wgpu = { version = "=0.1.0", path = "crates/rne_render_wgpu" }
rne_robot = { version = "=0.1.0", path = "crates/rne_robot" }
rne_sdf = { version = "=0.1.0", path = "crates/rne_sdf" }
rne_sensor = { version = "=0.1.0", path = "crates/rne_sensor" }
rne_sumo = { version = "=0.1.0", path = "crates/rne_sumo" }
rne_traci = { version = "=0.1.0", path = "crates/rne_traci" }
rne_traffic = { version = "=0.1.0", path = "crates/rne_traffic" }
rne_urdf_import = { version = "=0.1.0", path = "crates/rne_urdf_import" }
rne_world = { version = "=0.1.0", path = "crates/rne_world" }

anyhow = "1"
base64 = "0.13.1"
bevy_ecs = "0.15"
glam = { version = "0.29", features = ["serde"] }
libloading = "0.8"
petgraph = "0.7"
rapier3d = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tobj = { version = "4.0.4", default-features = false }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "24"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
pollster = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
png = "0.18"
roxmltree = "0.20"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["hdr", "jpeg", "png"] }
earcutr = "0.5"
gltf = "1.4.1"

# Long-running legged rollouts are chaotic even before the intended ULP
# perturbations. Keeping debug assertions and symbols while using modest
# optimization prevents the unoptimized physics code path from selecting a
# different solver orbit (or taking many minutes per replay).
[profile.dev]
opt-level = 1

# Test binaries include the long chaotic physics rollouts. Use release codegen
# while retaining the test profile's debug assertions and symbols.
[profile.test]
opt-level = 3
