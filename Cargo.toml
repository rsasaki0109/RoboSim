  "examples/37_humanoid_stand",
  "examples/38_unitree_go2_gif",
  "examples/39_unitree_g1_gif",
  "examples/40_unitree_g1_factory_inspection",
  "examples/41_unitree_g1_parts_pick_place",
  "examples/42_unitree_g1_dex3_pick_place",
  "examples/43_deformable_cable",
  "examples/44_deformable_cloth",
  "examples/45_unitree_g1_cloth_handling",
  "examples/46_plateau_drone_gif",
  "examples/47_traffic_city_replay",
  "examples/48_imu_dead_reckoning",
  "examples/49_vehicle_dynamics",
  "examples/50_control_eval",
  "examples/51_latency_in_the_loop",
  "examples/52_go2_fall_vs_save",
  "examples/53_go2_walk_vs_stand_push",
  "examples/54_go2_learned_turn",
  "examples/55_go2_stepped_turn",
  "examples/56_go2_torque_turn",
  "examples/57_go2_torque_policy",
  "examples/58_go2_steered_turn",
  "examples/59_go2_authority_turn",
  "examples/60_go2_turn_gif",
  "examples/61_go2_learned_sprint",
  "examples/62_g1_learned_stride",
  "examples/63_g1_stride_gif",
  "examples/64_go2_pure_torque",
  "examples/65_go2_velocity_terrain",
  "examples/66_locomotion_vectorized",
  "examples/67_g1_commanded_locomotion",
  "examples/68_g1_heading_turn",
  "tests/determinism",
  "tests/dynamics",
  "tools/rne_asset_cli",
  "tools/rne_plateau_import",
  "xtask",
]
exclude = [
  "adapters/ros2/rne_ros2_node",
  # Standalone wasm crate with its own [workspace]: joining the root workspace
  # would unify native-only features into the wasm32 build.
  "web/rne_web_viewer",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsasaki0109/RoboSim"
version = "0.13.0"

[workspace.dependencies]
anyhow = "1"
bevy_ecs = "0.15"
glam = { version = "0.29", features = ["serde"] }
petgraph = "0.7"
rapier3d = "0.22"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tobj = { version = "4.0.4", default-features = false }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "24"
pollster = "0.4"
pyo3 = { version = "0.23", features = ["abi3-py39"] }
roxmltree = "0.20"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["hdr", "jpeg", "png"] }
earcutr = "0.5"
gltf = "1.4.1"

# Long-running legged rollouts are chaotic even before the intended ULP
# perturbations. Keeping debug assertions and symbols while using modest
# optimization prevents the unoptimized physics code path from selecting a
# different solver orbit (or taking many minutes per replay).
[profile.dev]
opt-level = 1

# Test binaries include the long chaotic physics rollouts. Use release codegen
# while retaining the test profile's debug assertions and symbols.
[profile.test]
opt-level = 3
