  "crates/rne_ecs",
  "crates/rne_world",
  "crates/rne_physics",
  "crates/rne_physics_rapier",
  "crates/rne_deformable",
  "crates/rne_robot",
  "crates/rne_data",
  "crates/rne_log",
  "crates/rne_sensor",
  "crates/rne_render",
  "crates/rne_render_wgpu",
  "crates/rne_ai",
  "crates/rne_assets",
  "crates/rne_py",
  "crates/rne_plateau",
  "crates/rne_traffic",
  "crates/rne_urdf_import",
  "adapters/ros2/rne_adapter_ros2",
  "examples/00_hello_world",
  "examples/01_falling_cube",
  "examples/01_diff_drive_lidar",
  "examples/02_render_clear",
  "examples/03_urdf_import",
  "examples/05_episode_diff_drive",
  "examples/06_scene_load",
  "examples/07_render_primitives",
  "examples/08_scene_episode",
  "examples/09_urdf_mesh_render",
  "examples/10_vectorized_episode",
  "examples/11_agent_policy",
  "examples/12_shared_world_agent",
  "examples/13_multi_robot_agent",
  "examples/14_interactive_viewer",
  "examples/15_asset_hot_reload",
  "examples/16_goal_conditioned_agent",
  "examples/17_multi_robot_collision",
  "examples/18_readme_hero",
  "examples/19_lidar_render",
  "examples/20_mobile_manipulator_arm",
  "examples/21_mobile_manipulator_reach",
  "examples/22_mobile_manipulator_grasp",
  "examples/23_mobile_manipulator_transport",
  "examples/24_mobile_manipulator_wrist_cam",
  "examples/25_mobile_manipulator_episode",
  "examples/26_mobile_manipulator_place",
  "examples/28_mobile_manipulator_vectorized",
  "examples/29_mobile_manipulator_curriculum",
  "examples/30_mobile_manipulator_lift",
  "examples/31_mobile_manipulator_lift_pick_place",
  "examples/32_lift_pick_place_hero",
  "examples/33_clutter_pick_place_e2e",
  "examples/34_mobile_clutter_pick_place_e2e",
  "examples/35_external_urdf",
